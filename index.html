<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Inmersión nativa de borde a borde en iPhone (Isla Dinámica + barra gestual) y Android -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Identidad Oficial TOTAL TENIS -->
    <title>TOTAL TENIS · Circuito Oficial</title>
    <meta
      name="description"
      content="Ranking oficial, retos en cancha, torneos, sedes con clima en vivo y ecosistema de entrenadores en TOTAL TENIS."
    />

    <!-- Color de barra del sistema -->
    <meta name="theme-color" content="#1E0734" />
    <meta name="color-scheme" content="dark light" />

    <!-- Metadatos PWA para instalación en iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TOTAL TENIS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Ícono oficial y Manifiesto PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/assets/logo-total-tenis.png" />
    <link rel="apple-touch-icon" href="/assets/logo-total-tenis.png" />

    <!-- OneSignal Web Push SDK v16 (TOTAL TENIS) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "48f44cfa-0872-4a85-aded-bb1e235daea7",
          serviceWorkerParam: { scope: "/" },
          serviceWorkerPath: "/OneSignalSDKWorker.js",
          allowLocalhostAsSecureOrigin: true
        });
      });
    </script>

    <!-- Tipografías Oficiales (Antonio condensada + Outfit Black + Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Crítico de Arranque: altura real edge-to-edge sin recorte 100dvh en iPhone PWA -->
    <style>
      :root {
        --tt-font-display: 'Antonio', 'Outfit', system-ui, -apple-system, sans-serif;
        --tt-font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        --tt-safe-top: env(safe-area-inset-top, 0px);
        --tt-safe-bottom: env(safe-area-inset-bottom, 0px);
        --tt-safe-left: env(safe-area-inset-left, 0px);
        --tt-safe-right: env(safe-area-inset-right, 0px);
      }

      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: var(--tt-app-h, 100%);
        min-height: 100%;
        overflow: hidden;
        font-family: var(--tt-font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        background-color: #1E0734;
        color: #FAF9F5;
      }

      html[data-theme='light'],
      html[data-theme='light'] body,
      html[data-theme='light'] #root {
        background-color: #FAF9F5;
        color: #1E0734;
      }
    </style>

    <!-- Escudo Anti-Destello: aplica el tema guardado ANTES de pintar el primer píxel -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('tt_theme_pref_v2');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'light' ? '#FAF9F5' : '#1E0734');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
